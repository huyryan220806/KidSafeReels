# Local container deployment. API port is accessible only inside the Compose network.
server {
    listen 8000;
    client_max_body_size 52m;
    client_body_timeout 30s;
    location / {
        proxy_pass http://api:8000;
        proxy_request_buffering on;
        proxy_read_timeout 220s;
        proxy_send_timeout 30s;
    }
}

server {
    listen 8501;
    client_max_body_size 52m;
    client_body_timeout 30s;
    # Resolve at request time so web can start after this gateway.
    resolver 127.0.0.11 valid=10s;
    set $web_upstream http://web:8501;
    location / {
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
