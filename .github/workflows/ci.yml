name: App and ML checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - if: runner.os == 'Linux'
        run: docker compose -f deploy/compose.yaml config --quiet
      - run: python -m pip install -r requirements/requirements-dev.txt -r requirements/requirements-pilot.txt -r requirements/requirements-training.txt
      - run: python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q
      - run: python -m pip check
